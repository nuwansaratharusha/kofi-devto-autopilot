name: 03 - Verified Polyglot Guardrail CI Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-python-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Python reliability suite
        run: python3 -m unittest test_pro_kit -v
      - name: Run Node.js zero-dep guardrail suite
        run: node --test test_guardrails.mjs
