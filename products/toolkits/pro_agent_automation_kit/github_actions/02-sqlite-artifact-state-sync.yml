name: 02 - SQLite WAL Artifact State Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: sqlite-state-sync
  cancel-in-progress: false

jobs:
  stateful-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize or inspect SQLite WAL queue stats
        run: |
          mkdir -p state
          python3 wal_queue.py --db state/wal_queue.db stats
      - name: Upload durable SQLite state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wal-queue-snapshot
          path: state/wal_queue.db
          retention-days: 14
