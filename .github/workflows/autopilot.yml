name: Omnichannel 30-Day Content & Storefront Autopilot

on:
  schedule:
    # Every day at 13:00 UTC (= 18:30 Asia/Colombo): Blogger + Pinterest daily, DEV.to Mon/Wed/Fri
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional override date YYYY-MM-DD (defaults to today in Asia/Colombo)'
        required: false
        default: ''
      publish_mode:
        description: 'DEV.to staging mode (draft or live)'
        required: false
        default: 'draft'
      blogger_publish_mode:
        description: 'Blogger v3 publishing mode (draft or live)'
        required: false
        default: 'draft'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kofi-devto-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build-and-publish-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'draft' }}
      LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
      LEMONSQUEEZY_STORE_ID: ${{ vars.LEMONSQUEEZY_STORE_ID || '' }}
      LEMONSQUEEZY_STORE_URL: ${{ vars.LEMONSQUEEZY_STORE_URL || '' }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      GUMROAD_STORE_URL: ${{ vars.GUMROAD_STORE_URL || '' }}
      BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID || secrets.BLOGGER_BLOG_ID || '' }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_PUBLISH_MODE: ${{ inputs.blogger_publish_mode || vars.BLOGGER_PUBLISH_MODE || 'draft' }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID || secrets.PINTEREST_BOARD_ID || '' }}
      KOFI_PROFILE_URL: ${{ vars.KOFI_PROFILE_URL || 'https://ko-fi.com/tharushanuwansara' }}
      PRIMARY_STORE_URL: ${{ vars.PRIMARY_STORE_URL || 'https://ko-fi.com/tharushanuwansara/shop' }}
      MIRROR_STORE_URL: ${{ vars.MIRROR_STORE_URL || '' }}
      CANONICAL_BASE_URL: ${{ vars.CANONICAL_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      EXPERIMENT_START_DATE: ${{ vars.EXPERIMENT_START_DATE || '2026-11-18' }}
      EXPERIMENT_END_DATE: ${{ vars.EXPERIMENT_END_DATE || '2026-12-18' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (stdlib-only, zero pip install)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (for zero-dep Node guardrail kit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full offline deterministic test suite
        run: python3 -m unittest discover -s tests -v

      - name: Self-test and package deterministic .zip product kits
        run: python3 autopilot.py build-products --json

      - name: Execute daily Blogger + Pinterest + Mon/Wed/Fri DEV.to & 30d report
        env:
          TARGET_DATE: ${{ inputs.date || '' }}
        run: |
          if [ -n "${TARGET_DATE}" ]; then
            python3 autopilot.py run-daily --date "${TARGET_DATE}" --json
          else
            python3 autopilot.py run-daily --json
          fi

      - name: Persist SQLite ledger, static hub, pins & 30d reports on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pipeline.db site/ exports/ products/dist/
          if ! git diff --staged --quiet; then
            git commit -m "chore(autopilot): daily series, pins & 30d experiment ledger [skip ci]"
            git push
          fi

      - name: Upload packaged .zip kits, pins & syndication bundles
        uses: actions/upload-artifact@v4
        with:
          name: omnichannel-kits-pins-and-reports
          path: |
            products/dist/*.zip
            products/dist/manifest.json
            exports/
            site/pins/
          retention-days: 14

      - name: Upload static canonical hub & Pinterest RSS for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: verify-build-and-publish-daily
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy canonical static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
