name: Ko-fi & DEV.to Verified Content Autopilot

on:
  schedule:
    # Monday, Wednesday, Friday at 13:00 UTC (= 18:30 Asia/Colombo, US/EU dev peak)
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of verified tutorials to generate in this run'
        required: false
        default: '1'
      publish_mode:
        description: 'DEV.to staging mode (draft or live)'
        required: false
        default: 'draft'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kofi-devto-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'draft' }}
      KOFI_PROFILE_URL: ${{ vars.KOFI_PROFILE_URL || 'https://ko-fi.com/tharushanuwansara' }}
      PRIMARY_STORE_URL: ${{ vars.PRIMARY_STORE_URL || 'https://ko-fi.com/tharushanuwansara/shop' }}
      MIRROR_STORE_URL: ${{ vars.MIRROR_STORE_URL || '' }}
      CANONICAL_BASE_URL: ${{ vars.CANONICAL_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (stdlib-only, zero pip install)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (for zero-dep Node guardrail kit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full offline deterministic test suite
        run: python3 -m unittest discover -s tests -v

      - name: Self-test and package deterministic .zip product kits
        run: python3 autopilot.py build-products --json

      - name: Execute verified tutorial pipeline & stage DEV.to draft
        env:
          RUN_LIMIT: ${{ inputs.limit || '1' }}
        run: python3 autopilot.py run-pipeline --limit "${RUN_LIMIT}" --push-draft --json

      - name: Persist SQLite ledger, static hub & syndication bundles on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pipeline.db site/ exports/ products/dist/
          if ! git diff --staged --quiet; then
            git commit -m "chore(autopilot): persist verified ledger & static hub [skip ci]"
            git push
          fi

      - name: Upload packaged .zip kits & syndication bundles
        uses: actions/upload-artifact@v4
        with:
          name: kofi-kits-and-syndication-bundles
          path: |
            products/dist/*.zip
            products/dist/manifest.json
            exports/
          retention-days: 14

      - name: Upload static canonical hub for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: verify-build-and-stage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy canonical static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
