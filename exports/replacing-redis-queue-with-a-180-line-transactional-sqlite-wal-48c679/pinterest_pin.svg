  <text x="90" y="502" fill="#cbd5e1" font-family="monospace" font-size="22">01  def init_wal_queue(db_path: Path) -&gt; sqlite3..</text><text x="90" y="540" fill="#cbd5e1" font-family="monospace" font-size="22">02    conn = sqlite3.connect(str(db_path), timeo..</text><text x="90" y="578" fill="#cbd5e1" font-family="monospace" font-size="22">03    conn.row_factory = sqlite3.Row</text><text x="90" y="616" fill="#cbd5e1" font-family="monospace" font-size="22">04    conn.execute(&quot;PRAGMA journal_mode=WAL;&quot;)</text><text x="90" y="654" fill="#cbd5e1" font-family="monospace" font-size="22">05    conn.execute(&quot;PRAGMA synchronous=NORMAL;&quot;)</text><text x="90" y="692" fill="#cbd5e1" font-family="monospace" font-size="22">06    conn.execute(&quot;PRAGMA busy_timeout=5000;&quot;)</text><text x="90" y="730" fill="#cbd5e1" font-family="monospace" font-size="22">07    conn.execute(</text><text x="90" y="768" fill="#cbd5e1" font-family="monospace" font-size="22">08      &quot;&quot;&quot;</text><text x="90" y="806" fill="#cbd5e1" font-family="monospace" font-size="22">09      CREATE TABLE IF NOT EXISTS queue_jobs (</text><text x="90" y="844" fill="#cbd5e1" font-family="monospace" font-size="22">10        job_id TEXT PRIMARY KEY,</text>

